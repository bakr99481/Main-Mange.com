<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>تقويم الإنجازات - متتبع المهام الذكي</title>
    <meta name="description" content="تطبيق تقويم وإنجازات يومية مع مهام ونسبة إنجاز ذكية - PWA">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="تقويم الإنجازات">

    <!-- Manifest PWA -->
    <link rel="manifest" href="data:application/manifest+json,{
      %22name%22:%22%D8%AA%D9%82%D9%88%D9%8A%D9%85%20%D8%A7%D9%84%D8%A5%D9%86%D8%AC%D8%A7%D8%B2%D8%A7%D8%AA%22,
      %22short_name%22:%22%D8%A5%D9%86%D8%AC%D8%A7%D8%B2%D8%A7%D8%AA%22,
      %22start_url%22:%22.%22,
      %22display%22:%22standalone%22,
      %22background_color%22:%22%23020617%22,
      %22theme_color%22:%22%2300f2fe%22,
      %22icons%22:[
        {%22src%22:%22https://cdn-icons-png.flaticon.com/512/2838/2838912.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22},
        {%22src%22:%22https://cdn-icons-png.flaticon.com/512/2838/2838912.png%22,%22sizes%22:%22192x192%22,%22type%22:%22image/png%22}
      ]
    }">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: #020617;
            padding: 30px 20px;
            min-height: 100vh;
        }

        /* زر التثبيت */
        .install-pwa {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 242, 254, 0.5);
            border-radius: 60px;
            padding: 10px 22px;
            color: #00f2fe;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            z-index: 5000;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .install-pwa:hover {
            background: #00f2fe;
            color: #020617;
            transform: scale(1.02);
        }
        .install-pwa.hidden {
            display: none;
        }

        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 30px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-add-card {
            display: block;
            margin: 0 auto 30px auto;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f2fe;
            background: transparent;
            border: 2px solid #00f2fe;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .btn-add-card:hover {
            background: #00f2fe;
            color: #020617;
            box-shadow: 0 0 25px #00f2fe;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(115px, 125px));
            gap: 14px;
            justify-content: center;
        }

        .day-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            aspect-ratio: 1 / 1.1;
            display: flex;
            flex-direction: column;
            padding: 10px 8px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .day-card:hover {
            transform: translateY(-5px);
            border-color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .week-num {
            background: linear-gradient(135deg, #00f2fe20, #7000ff20);
            border-radius: 30px;
            text-align: center;
            padding: 5px 0;
            font-size: 0.8rem;
            font-weight: bold;
            color: #00f2fe;
            margin-bottom: 8px;
        }

        .day-middle {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .day-ar {
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00f2fe, #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .day-en {
            font-size: 0.65rem;
            color: #94a3b8;
        }

        .date-bottom {
            text-align: center;
            margin-top: 5px;
        }
        .hijri-num {
            font-size: 0.7rem;
            color: #00f2fe;
            font-weight: bold;
        }
        .gregorian-full {
            font-size: 0.65rem;
            color: #94a3b8;
        }

        .detail-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            z-index: 4000;
            overflow-y: auto;
        }

        .detail-content {
            min-height: 100vh;
            width: 100%;
            background: #020617;
            padding: 30px;
            position: relative;
        }

        .top-rectangles {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 80px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .date-rectangle {
            background: rgba(0, 242, 254, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 24px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 500;
            color: #00f2fe;
            direction: ltr;
        }

        .percentage-rectangle {
            background: rgba(0, 242, 254, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 24px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #00f2fe;
            text-align: center;
            min-width: 160px;
        }

        .tasks-container {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 32px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0,242,254,0.2);
        }

        .tasks-title {
            color: #00f2fe;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .toggle-tasks-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            color: #00f2fe;
            padding: 5px 10px;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .task-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 20px;
            padding: 15px;
            transition: 0.2s;
            cursor: pointer;
        }

        .task-item:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .task-name {
            font-size: 1rem;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .task-details {
            display: flex;
            gap: 15px;
            font-size: 0.75rem;
        }

        .difficulty {
            color: #fbbf24;
        }

        .time {
            color: #34d399;
        }

        .add-task-btn {
            background: transparent;
            border: 2px solid #00f2fe;
            color: #00f2fe;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.2s;
            display: inline-block;
        }

        .add-task-btn:hover {
            background: #00f2fe;
            color: #020617;
        }

        .task-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            z-index: 5000;
            justify-content: center;
            align-items: center;
        }

        .task-modal-content {
            background: #0f172a;
            border: 1px solid #00f2fe;
            border-radius: 32px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
        }

        .task-modal-content h4 {
            color: #00f2fe;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .task-modal-content input, 
        .task-modal-content select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid #00f2fe;
            border-radius: 20px;
            color: white;
            font-size: 1rem;
        }

        .modal-buttons-task {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-buttons-task button {
            flex: 1;
            padding: 10px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .save-task {
            background: #00f2fe;
            color: #020617;
            border: none;
        }

        .cancel-task {
            background: transparent;
            border: 1px solid #94a3b8;
            color: #94a3b8;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid #00f2fe;
            border-radius: 30px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .modal-content h3 { color: #00f2fe; margin-bottom: 20px; }
        .section-title { color: #00f2fe; margin: 15px 0 10px; border-bottom: 1px solid rgba(0,242,254,0.3); display: inline-block; }
        .row { display: flex; gap: 10px; margin: 10px 0; }
        .row input, .row select { flex: 1; padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid #00f2fe; border-radius: 20px; color: white; font-size: 0.9rem; text-align: center; }
        .modal-buttons { display: flex; gap: 15px; margin-top: 25px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .btn-confirm { background: #00f2fe; color: #020617; }
        .btn-cancel { background: transparent; border: 1px solid #94a3b8; color: #94a3b8; }

        @media (max-width: 600px) {
            .calendar-grid { grid-template-columns: repeat(auto-fit, minmax(100px, 110px)); gap: 10px; }
            .top-rectangles { margin-bottom: 60px; }
            .date-rectangle, .percentage-rectangle { padding: 6px 16px; font-size: 0.8rem; }
            .task-item { text-align: center; }
            .row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div id="detailScreen" class="detail-screen">

        <div class="top-rectangles">
            <div class="date-rectangle" id="dateRect">الثلاثاء 22-3-2026</div>
            <div class="percentage-rectangle" id="percentageRect">نسبة الإنجاز: --%</div>
        </div>

            </div>

</div>

<div id="taskModal" class="task-modal">
    <div class="task-modal-content">
        <h4>➕ إضافة مهمة جديدة</h4>
        <input type="text" id="taskName" placeholder="اسم المهمة">
        <select id="taskDifficulty">
            <option value="1">⭐ سهلة جداً (1)</option>
            <option value="2">⭐⭐ سهلة (2)</option>
            <option value="3">⭐⭐⭐ متوسطة (3)</option>
            <option value="4">⭐⭐⭐⭐ صعبة (4)</option>
            <option value="5">⭐⭐⭐⭐⭐ صعبة جداً (5)</option>
        </select>
        <input type="number" id="taskTime" placeholder="الوقت المستغرق (بالدقائق)">
        <div class="modal-buttons-task">
            <button class="save-task" id="saveTaskBtn">💾 حفظ</button>
            <button class="cancel-task" id="cancelTaskBtn">إلغاء</button>
        </div>
    </div>
</div>

<script>
    // بيانات
    let allCardsData = [];
    let currentCardId = null;
    let currentGregDate = null;
    
    // عناصر
    const gridContainer = document.getElementById('calendarGrid');
    const addCardBtn = document.getElementById('addCardBtn');
    const modalEl = document.getElementById('dateModal');
    const confirmModalBtn = document.getElementById('confirmBtn');
    const cancelModalBtn = document.getElementById('cancelBtn');
    const detailScreen = document.getElementById('detailScreen');
    const dateRect = document.getElementById('dateRect');
    const percentageRect = document.getElementById('percentageRect');
    const toggleTasksBtn = document.getElementById('toggleTasksBtn');
    const tasksListDiv = document.getElementById('tasksList');
    const addTaskBtnInDetail = document.getElementById('addTaskBtnInDetail');
    const taskModal = document.getElementById('taskModal');
    const taskNameInput = document.getElementById('taskName');
    const taskDifficultySelect = document.getElementById('taskDifficulty');
    const taskTimeInput = document.getElementById('taskTime');
    const saveTaskBtn = document.getElementById('saveTaskBtn');
    const cancelTaskBtn = document.getElementById('cancelTaskBtn');
    
    const hijriDayInput = document.getElementById('hijriDay');
    const hijriMonthSelect = document.getElementById('hijriMonth');
    const hijriYearInput = document.getElementById('hijriYear');
    const gregDayInput = document.getElementById('gregDay');
    const gregMonthSelect = document.getElementById('gregMonth');
    const gregYearInput = document.getElementById('gregYear');
    const weekdaySelect = document.getElementById('weekdaySelect');
    
    const daysArabic = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
    const daysEnglish = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const hijriMonths = ["محرم", "صفر", "ربيع الأول", "ربيع الآخر", "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان", "رمضان", "شوال", "ذو القعدة", "ذو الحجة"];
    
    // تعبئة الأشهر
    hijriMonths.forEach((m, i) => { let opt = document.createElement('option'); opt.value = i+1; opt.textContent = m; hijriMonthSelect.appendChild(opt); });
    const gregMonthsNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
    gregMonthsNames.forEach((m, i) => { let opt = document.createElement('option'); opt.value = i; opt.textContent = m; gregMonthSelect.appendChild(opt); });
    
    // حساب رقم الأسبوع (نظام الجمعة)
    function calculateWeekNumber(cardDate, allSortedDates) {
        if (!allSortedDates.length) return 1;
        const firstDate = allSortedDates[0];
        const firstDay = firstDate.getDay();
        let firstFriday = new Date(firstDate);
        if (firstDay !== 5) {
            let daysToFri = (5 - firstDay + 7) % 7;
            firstFriday.setDate(firstDate.getDate() + daysToFri);
        }
        if (cardDate.getTime() <= firstFriday.getTime()) return 1;
        let nextSaturday = new Date(firstFriday);
        nextSaturday.setDate(firstFriday.getDate() + 1);
        let diff = Math.floor((cardDate.getTime() - nextSaturday.getTime()) / 86400000);
        if (diff < 0) return 1;
        return 2 + Math.floor(diff / 7);
    }
    
    function refreshAllWeeks() {
        const cards = document.querySelectorAll('.day-card');
        const allDates = [];
        cards.forEach(card => {
            const gregSpan = card.querySelector('.gregorian-full');
            if (gregSpan) {
                const txt = gregSpan.innerText;
                const parts = txt.split('/');
                if (parts.length === 3) {
                    const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
                    if (!isNaN(d)) allDates.push(d);
                }
            }
        });
        allDates.sort((a,b) => a - b);
        cards.forEach(card => {
            const gregSpan = card.querySelector('.gregorian-full');
            if (gregSpan) {
                const txt = gregSpan.innerText;
                const parts = txt.split('/');
                if (parts.length === 3) {
                    const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
                    const weekNum = calculateWeekNumber(d, allDates);
                    const weekDiv = card.querySelector('.week-num');
                    if (weekDiv) weekDiv.textContent = `الأسبوع ${weekNum}`;
                }
            }
        });
    }
    
    function saveData() { localStorage.setItem('tasksCalendarData', JSON.stringify(allCardsData)); }
    
    function loadData() {
        const saved = localStorage.getItem('tasksCalendarData');
        if (saved) { allCardsData = JSON.parse(saved); }
        else {
            allCardsData = [{
                cardId: Date.now(),
                dateGreg: new Date(2026, 2, 22).toISOString(),
                hijriDay: 24, hijriMonth: 9, hijriYear: 1447,
                tasks: []
            }];
            saveData();
        }
    }
    
    // AI حساب النسبة
    function calculateAIPercentage(currentDate, tasks) {
        if (!tasks || tasks.length === 0) return 0;
        let currentTotalScore = 0;
        tasks.forEach(t => {
            let diffScore = (6 - parseInt(t.difficulty)) * 2;
            let timeScore = Math.max(0, 60 - parseInt(t.time)) / 10;
            currentTotalScore += (diffScore + timeScore);
        });
        let currentAvg = currentTotalScore / tasks.length;
        
        let nextWeekScores = [];
        for (let i = 1; i <= 7; i++) {
            let nextDate = new Date(currentDate);
            nextDate.setDate(currentDate.getDate() + i);
            let nextDateStr = nextDate.toISOString();
            let foundCard = allCardsData.find(c => c.dateGreg === nextDateStr);
            if (foundCard && foundCard.tasks && foundCard.tasks.length > 0) {
                let nextTotal = 0;
                foundCard.tasks.forEach(t => {
                    let diffScore = (6 - parseInt(t.difficulty)) * 2;
                    let timeScore = Math.max(0, 60 - parseInt(t.time)) / 10;
                    nextTotal += (diffScore + timeScore);
                });
                nextWeekScores.push(nextTotal / foundCard.tasks.length);
            }
        }
        if (nextWeekScores.length === 0) return 100;
        let avgNextWeek = nextWeekScores.reduce((a,b) => a+b, 0) / nextWeekScores.length;
        if (currentAvg >= avgNextWeek) return 100;
        return Math.max(0, Math.min(100, Math.floor((currentAvg / avgNextWeek) * 100)));
    }
    
    function updatePercentage() {
        let card = allCardsData.find(c => c.cardId == currentCardId);
        if (card) {
            let percent = calculateAIPercentage(new Date(card.dateGreg), card.tasks);
            percentageRect.innerText = `نسبة الإنجاز: ${percent}%`;
        }
    }
    
    // عرض المهام (الحذف بالضغط الطويل)
    function renderTasks() {
        if (!currentCardId) return;
        let card = allCardsData.find(c => c.cardId == currentCardId);
        if (!card) return;
        tasksListDiv.innerHTML = '';
        if (card.tasks.length === 0) {
            tasksListDiv.innerHTML = '<div style="color:#94a3b8; text-align:center; padding:20px;">لا توجد مهام. أضف مهمتك الأولى!</div>';
        } else {
            card.tasks.forEach((task, idx) => {
                let taskDiv = document.createElement('div');
                taskDiv.className = 'task-item';
                let stars = '⭐'.repeat(parseInt(task.difficulty));
                taskDiv.innerHTML = `
                    <div class="task-name">📌 ${escapeHtml(task.name)}</div>
                    <div class="task-details">
                        <span class="difficulty">${stars} (${task.difficulty}/5)</span>
                        <span class="time">🕒 ${task.time} دقيقة</span>
                    </div>
                `;
                // حذف بالضغط الطويل
                let pressTimer;
                taskDiv.addEventListener('mousedown', () => {
                    pressTimer = setTimeout(() => {
                        if (confirm('🗑️ حذف هذه المهمة؟')) {
                            card.tasks.splice(idx, 1);
                            saveData();
                            renderTasks();
                            updatePercentage();
                        }
                    }, 500);
                });
                taskDiv.addEventListener('mouseup', () => clearTimeout(pressTimer));
                taskDiv.addEventListener('mouseleave', () => clearTimeout(pressTimer));
                taskDiv.addEventListener('touchstart', () => {
                    pressTimer = setTimeout(() => {
                        if (confirm('🗑️ حذف المهمة؟')) {
                            card.tasks.splice(idx, 1);
                            saveData();
                            renderTasks();
                            updatePercentage();
                        }
                    }, 500);
                });
                taskDiv.addEventListener('touchend', () => clearTimeout(pressTimer));
                tasksListDiv.appendChild(taskDiv);
            });
        }
        updatePercentage();
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function openDetailScreen(cardId, gregorianDateObj, hijriText, gregorianText) {
        currentCardId = cardId;
        currentGregDate = gregorianDateObj;
        let dayName = daysArabic[gregorianDateObj.getDay()];
        let formatted = `${dayName} ${gregorianDateObj.getDate()}-${gregorianDateObj.getMonth()+1}-${gregorianDateObj.getFullYear()}`;
        dateRect.innerText = formatted;
        renderTasks();
        detailScreen.style.display = 'flex';
        let tasksArea = document.getElementById('tasksListArea');
        tasksArea.style.display = 'block';
        toggleTasksBtn.innerText = '▼';
    }
    
    function addNewTask() {
        let name = taskNameInput.value.trim();
        if (!name) { alert("أدخل اسم المهمة"); return; }
        let difficulty = taskDifficultySelect.value;
        let time = parseInt(taskTimeInput.value);
        if (isNaN(time) || time <= 0) { alert("أدخل وقت صحيح"); return; }
        let card = allCardsData.find(c => c.cardId == currentCardId);
        if (card) {
            card.tasks.push({ name, difficulty, time });
            saveData();
            renderTasks();
            taskModal.style.display = 'none';
            taskNameInput.value = '';
            taskTimeInput.value = '';
        }
    }
    
    // إيماءة الرجوع
    let touchStart = 0;
    detailScreen.addEventListener('touchstart', (e) => { touchStart = e.changedTouches[0].screenX; });
    detailScreen.addEventListener('touchend', (e) => {
        let touchEnd = e.changedTouches[0].screenX;
        if (Math.abs(touchEnd - touchStart) > 70) detailScreen.style.display = 'none';
    });
    detailScreen.addEventListener('click', (e) => { if (e.target === detailScreen) detailScreen.style.display = 'none'; });
    
    // toggle مستطيل المهام
    let tasksAreaDiv = document.getElementById('tasksListArea');
    toggleTasksBtn.addEventListener('click', () => {
        if (tasksAreaDiv.style.display === 'none') {
            tasksAreaDiv.style.display = 'block';
            toggleTasksBtn.innerText = '▼';
        } else {
            tasksAreaDiv.style.display = 'none';
            toggleTasksBtn.innerText = '▶';
        }
    });
    
    addTaskBtnInDetail.addEventListener('click', () => { taskModal.style.display = 'flex'; });
    saveTaskBtn.addEventListener('click', addNewTask);
    cancelTaskBtn.addEventListener('click', () => { taskModal.style.display = 'none'; });
    window.addEventListener('click', (e) => { if (e.target === taskModal) taskModal.style.display = 'none'; });
    
    function createCardElement(cardData) {
        let date = new Date(cardData.dateGreg);
        let dayIndex = date.getDay();
        let hijriText = `${cardData.hijriDay} ${hijriMonths[cardData.hijriMonth-1]} ${cardData.hijriYear}`;
        let gregText = `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
        let card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML = `
            <div class="week-num">الأسبوع --</div>
            <div class="day-middle">
                <div class="day-ar">${daysArabic[dayIndex]}</div>
                <div class="day-en">${daysEnglish[dayIndex]}</div>
            </div>
            <div class="date-bottom">
                <div class="hijri-num">${hijriText}</div>
                <div class="gregorian-full">${gregText}</div>
            </div>
        `;
        card.addEventListener('click', () => { openDetailScreen(cardData.cardId, date, hijriText, gregText); });
        // حذف المربع بالضغط الطويل
        let timer;
        card.addEventListener('mousedown', () => { timer = setTimeout(() => { if(confirm('حذف المربع؟')) { card.remove(); allCardsData = allCardsData.filter(c => c.cardId != cardData.cardId); saveData(); refreshAllWeeks(); } }, 500); });
        card.addEventListener('mouseup', () => clearTimeout(timer));
        card.addEventListener('mouseleave', () => clearTimeout(timer));
        card.addEventListener('touchstart', () => { timer = setTimeout(() => { if(confirm('حذف المربع؟')) { card.remove(); allCardsData = allCardsData.filter(c => c.cardId != cardData.cardId); saveData(); refreshAllWeeks(); } }, 500); });
        card.addEventListener('touchend', () => clearTimeout(timer));
        return card;
    }
    
    function renderAllCards() {
        gridContainer.innerHTML = '';
        allCardsData.forEach(cardData => { gridContainer.appendChild(createCardElement(cardData)); });
        refreshAllWeeks();
    }
    
    function addNewCardFromModal() {
        let hDay = parseInt(hijriDayInput.value);
        let hMonth = parseInt(hijriMonthSelect.value);
        let hYear = parseInt(hijriYearInput.value);
        let gDay = parseInt(gregDayInput.value);
        let gMonth = parseInt(gregMonthSelect.value);
        let gYear = parseInt(gregYearInput.value);
        if (isNaN(hDay) || isNaN(hMonth) || isNaN(hYear) || isNaN(gDay) || isNaN(gMonth) || isNaN(gYear)) { alert("املأ جميع الحقول"); return; }
        let newDate = new Date(gYear, gMonth, gDay);
        if (newDate.getMonth() !== gMonth || newDate.getDate() !== gDay) { alert("تاريخ ميلادي غير صحيح"); return; }
        let newCard = { cardId: Date.now(), dateGreg: newDate.toISOString(), hijriDay: hDay, hijriMonth: hMonth, hijriYear: hYear, tasks: [] };
        allCardsData.push(newCard);
        saveData();
        renderAllCards();
        modalEl.style.display = 'none';
    }
    
    function setDefaultFormValues() {
        let last = allCardsData[allCardsData.length-1];
        if (last) {
            let lastDate = new Date(last.dateGreg);
            let nextDate = new Date(lastDate);
            nextDate.setDate(lastDate.getDate() + 1);
            let nextHijriDay = last.hijriDay + 1;
            let nextHijriMonth = last.hijriMonth;
            let nextHijriYear = last.hijriYear;
            let daysInMonth = [30,29,30,29,30,29,30,29,30,29,30,29][nextHijriMonth-1] || 30;
            if (nextHijriDay > daysInMonth) { nextHijriDay = 1; nextHijriMonth++; if(nextHijriMonth>12){nextHijriMonth=1; nextHijriYear++;} }
            gregDayInput.value = nextDate.getDate();
            gregMonthSelect.value = nextDate.getMonth();
            gregYearInput.value = nextDate.getFullYear();
            hijriDayInput.value = nextHijriDay;
            hijriMonthSelect.value = nextHijriMonth;
            hijriYearInput.value = nextHijriYear;
        } else {
            gregDayInput.value = 22; gregMonthSelect.value = 2; gregYearInput.value = 2026;
            hijriDayInput.value = 24; hijriMonthSelect.value = 9; hijriYearInput.value = 1447;
        }
        weekdaySelect.value = 'auto';
    }
    
    addCardBtn.onclick = () => { setDefaultFormValues(); modalEl.style.display = 'flex'; };
    confirmModalBtn.onclick = addNewCardFromModal;
    cancelModalBtn.onclick = () => modalEl.style.display = 'none';
    window.onclick = (e) => { if (e.target === modalEl) modalEl.style.display = 'none'; };
    
    // ====================== PWA التثبيت ======================
    let deferredPrompt = null;
    const installPwaBtn = document.getElementById('installPwaBtn');
    
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installPwaBtn.classList.remove('hidden');
    });
    
    installPwaBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installPwaBtn.classList.add('hidden');
            }
            deferredPrompt = null;
        } else {
            alert("✨ لتثبيت التطبيق: اضغط على قائمة المتصفح (٣ نقاط) واختر 'تثبيت التطبيق' أو 'Add to Home Screen'");
        }
    });
    
    window.addEventListener('appinstalled', () => {
        installPwaBtn.classList.add('hidden');
        deferredPrompt = null;
    });
    
    if (window.matchMedia('(display-mode: standalone)').matches) {
        installPwaBtn.style.display = 'none';
    }
    
    // Service Worker للتخزين المؤقت والتثبيت
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
            self.addEventListener('install', e => e.waitUntil(caches.open('tasks-calendar-pwa').then(c => c.addAll(['/']))));`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(() => console.log('SW ready for calendar'));
        });
    }
    
    loadData();
    renderAllCards();
</script>
</body>
</html>
